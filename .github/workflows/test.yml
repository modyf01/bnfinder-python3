name: Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .

    - name: Test imports
      run: |
        python -c "from BNfinder import data, graph, stats, pstat, BDE, MDL, MIT, score"
        echo "All modules imported successfully"

    - name: Test CLI
      run: |
        python ./bnf -h
        python ./bnc -h
        python ./bnf-cv -h

    - name: Test basic functionality
      run: |
        python ./bnf -e doc/data/input1.txt -n /tmp/test_output.sif
        cat /tmp/test_output.sif
